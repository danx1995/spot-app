name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/api/go.mod
      - name: Resolve Go modules
        run: |
          go mod tidy
          echo "----- GO_SUM_BEGIN -----"
          cat go.sum
          echo "----- GO_SUM_END -----"
      - run: go test ./...
      - run: go vet ./...
