<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0B0F0C" />
  <title>СПОТ</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-logo">♥</div>
    <div class="boot-title">СПОТ</div>
    <div class="boot-subtitle">личная карта мест</div>
  </div>

  <div id="blocked" class="blocked hidden">
    <div class="blocked-logo">♥</div>
    <h1>Открой СПОТ в Telegram</h1>
    <p>Эта версия авторизуется через Telegram Mini Apps и не требует Apple ID, App Store или отдельной регистрации.</p>
    <button id="openTelegramButton" class="primary hidden">Открыть в Telegram</button>
  </div>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div>
        <div class="brand-row"><span class="brand-heart">♥</span><span class="brand">СПОТ</span></div>
        <div id="screenKicker" class="screen-kicker">ЛИЧНАЯ КАРТА</div>
      </div>
      <button id="profileChip" class="profile-chip" aria-label="Профиль">
        <img id="profileAvatar" alt="" class="profile-avatar hidden" />
        <span id="profileInitials">С</span>
      </button>
    </header>

    <section id="screen" class="screen"></section>

    <nav class="bottom-nav" aria-label="Навигация">
      <button data-tab="map" class="nav-item active"><span>⌖</span><small>Карта</small></button>
      <button data-tab="spots" class="nav-item"><span>♥</span><small>Споты</small></button>
      <button data-tab="add" class="nav-item nav-add"><span>＋</span><small>Добавить</small></button>
      <button data-tab="collections" class="nav-item"><span>▦</span><small>Подборки</small></button>
      <button data-tab="profile" class="nav-item"><span>●</span><small>Профиль</small></button>
    </nav>
  </main>

  <div id="sheetBackdrop" class="sheet-backdrop hidden">
    <div id="sheet" class="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
